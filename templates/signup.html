<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vedic Human – Create Account</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", "Segoe UI", sans-serif;
}

body {
    height: 100vh;
    background: url("/static/yoga3.jpg.jpeg") center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,0,0,0.45), rgba(30,92,42,0.55));
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    z-index: 0;
}

.container {
    position: relative;
    z-index: 1;
    width: 860px;
    max-width: 95vw;
    height: 560px;
    display: flex;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    animation: fadeIn 0.7s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* LEFT PANEL */
.left {
    width: 420px;
    flex-shrink: 0;
    background: url("/static/yoga3.jpg.jpeg") center/cover no-repeat;
    padding: 40px;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
}

.left::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.15) 0%,
        rgba(0,0,0,0.05) 40%,
        rgba(0,0,0,0.45) 100%
    );
}

.logo {
    font-size: 20px;
    font-weight: 600;
    position: relative;
    z-index: 1;
}

.quote {
    font-size: 26px;
    line-height: 1.4;
    position: relative;
    z-index: 1;
}

.quote span {
    color: #4fd98c;
    font-weight: 600;
}

/* RIGHT PANEL */
.right {
    flex: 1;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border-left: 1px solid rgba(255,255,255,0.1);
    padding: 50px 45px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

h2 {
    font-size: 28px;
    color: white;
    font-weight: 600;
    margin-bottom: 6px;
}

.subtitle {
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    margin-bottom: 28px;
}

input {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
}

input:focus {
    border-color: rgba(79,217,140,0.6);
    background: rgba(255,255,255,0.15);
}

input::placeholder {
    color: rgba(255,255,255,0.5);
}

button {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg, #2db560, #4fd98c);
    color: white;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-top: 4px;
    transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(79,217,140,0.45);
}

.login-link {
    margin-top: 20px;
    text-align: center;
    font-size: 13px;
    color: rgba(255,255,255,0.5);
}

.login-link a {
    color: #4fd98c;
    font-weight: 600;
    text-decoration: none;
}

.login-link a:hover {
    text-decoration: underline;
}

@media (max-width: 700px) {
    .container { height: auto; }
    .left { display: none; }
}
</style>
</head>
<body>

<div class="container">

    <!-- LEFT -->
    <div class="left">
        <div class="logo">Vedic Human</div>
        <div class="quote">
            Begin your journey<br>
            towards a <span>better you</span> 🌿
        </div>
    </div>

    <!-- RIGHT -->
    <div class="right">
        <h2>Create Account</h2>
        <p class="subtitle">Join us and start your wellness journey</p>

        <input type="text"     id="name"     placeholder="Full Name">
        <input type="email"    id="email"    placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <input type="password" id="confirm"  placeholder="Confirm Password">

        <button onclick="signupUser()">Sign Up</button>

        <div class="login-link">
            Already have an account?
            <a href="/">Login</a>
        </div>
    </div>

</div>

<script>
function signupUser() {
    const name     = document.getElementById("name").value.trim();
    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirm  = document.getElementById("confirm").value;

    if (!name || !email || !password || !confirm) {
        alert("Please fill all fields");
        return;
    }
    if (password !== confirm) {
        alert("Passwords do not match");
        return;
    }

    fetch("/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            alert("Account created successfully");
            window.location.href = "/";
        } else {
            alert("Signup failed: " + (data.message || ""));
        }
    })
    .catch(() => alert("Server error. Please try again."));
}
</script>

</body>
</html>
